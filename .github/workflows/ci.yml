name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be re-run by hand after a push that did not register.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Dogfood: DriftLock guards its own example MCP surface.
      - name: DriftLock drift gate
        run: node dist/src/cli.js verify --config driftlock.json
